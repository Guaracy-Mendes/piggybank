<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1786px;height:542px;background:#FFFFFF;" width="1786px" height="542px" viewBox="0 0 1786 542" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="645.291" y="24.966" fill="#000" font-size="14" textLength="488.696" font-weight="700">UML state — Account lifecycle and operational restrictions (proposed)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="4"><ellipse cx="157.98" cy="83.758" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="88.4" y="208.968" width="139.157" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="93.4" y="233.624" fill="#000" font-size="12" textLength="129.157">PENDING_ACTIVATION</text><rect x="898.98" y="336.478" width="50" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="904.048" y="361.134" fill="#000" font-size="12" textLength="39.864">ACTIVE</text><rect x="366.3" y="336.478" width="109.361" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="371.3" y="361.134" fill="#000" font-size="12" textLength="99.361">OPENING_FAILED</text><rect x="920.67" y="63.758" width="78.616" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="925.67" y="88.414" fill="#000" font-size="12" textLength="68.616">RESTRICTED</text><rect x="1239.08" y="208.968" width="121.805" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="1244.08" y="233.624" fill="#000" font-size="12" textLength="111.805">CLOSURE_PENDING</text><rect x="1228.35" y="336.478" width="55.264" height="40" fill="#EAF2F8" style="stroke:#385A75;stroke-width:0.5;" rx="4" ry="4"/><text x="1233.35" y="361.134" fill="#000" font-size="12" textLength="45.264">CLOSED</text><g class="end_entity" data-qualified-name=".end." id="ent0019" data-source-line="15"><ellipse cx="1063.98" cy="475.168" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="1063.98" cy="475.168" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="18"><path d="M1034.15,50.068 L1034.15,79.758 L999.62,83.758 L1034.15,87.758 L1034.15,117.444 A4,4 0 0 0 1038.15,121.444 L1291.812,121.444 A4,4 0 0 0 1295.812,117.444 L1295.812,56.068 L1285.812,46.068 L1038.15,46.068 A4,4 0 0 0 1034.15,50.068" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><path d="M1285.812,46.068 L1285.812,54.068 A2,2 0 0 0 1287.812,56.068 L1295.812,56.068 L1285.812,46.068" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><text x="1040.15" y="63.896" fill="#000" font-size="12" textLength="238.178">Restriction set defines debit, credit, access</text><text x="1040.15" y="80.24" fill="#000" font-size="12" textLength="228.482">and channel permissions independently.</text><text x="1040.15" y="96.584" fill="#000" font-size="12" textLength="240.662">No assumption that all credits are allowed.</text><text x="1040.15" y="112.928" fill="#000" font-size="12" textLength="226.766">Changes are versioned and attributable.</text></g><g class="entity" data-qualified-name="GMN25" id="ent0026" data-source-line="24"><path d="M1395.39,203.448 L1395.39,224.968 L1361.07,228.968 L1395.39,232.968 L1395.39,254.48 A4,4 0 0 0 1399.39,258.48 L1660.564,258.48 A4,4 0 0 0 1664.564,254.48 L1664.564,209.448 L1654.564,199.448 L1399.39,199.448 A4,4 0 0 0 1395.39,203.448" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><path d="M1654.564,199.448 L1654.564,207.448 A2,2 0 0 0 1656.564,209.448 L1664.564,209.448 L1654.564,199.448" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><text x="1401.39" y="217.276" fill="#000" font-size="12" textLength="248.174">Pending payments, holds, fees and disputes</text><text x="1401.39" y="233.62" fill="#000" font-size="12" textLength="230.354">must be resolved under approved policy.</text><text x="1401.39" y="249.964" fill="#000" font-size="12" textLength="222.47">Closure cannot discard residual money.</text></g><g class="entity" data-qualified-name="GMN28" id="ent0029" data-source-line="29"><path d="M1112.56,441.478 L1112.56,508.854 A4,4 0 0 0 1116.56,512.854 L1395.398,512.854 A4,4 0 0 0 1399.398,508.854 L1399.398,447.478 L1389.398,437.478 L1259.98,437.478 L1255.98,376.748 L1251.98,437.478 L1116.56,437.478 A4,4 0 0 0 1112.56,441.478" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><path d="M1389.398,437.478 L1389.398,445.478 A2,2 0 0 0 1391.398,447.478 L1399.398,447.478 L1389.398,437.478" style="stroke:#A58A3B;stroke-width:0.5;" fill="#FFF8DC"/><text x="1118.56" y="455.306" fill="#000" font-size="12" textLength="237.374">Identity, journal, statements and evidence</text><text x="1118.56" y="471.65" fill="#000" font-size="12" textLength="222.758">remain subject to retention/legal holds.</text><text x="1118.56" y="487.994" fill="#000" font-size="12" textLength="265.838">Late inbound/return evidence enters an owned</text><text x="1118.56" y="504.338" fill="#000" font-size="12" textLength="256.31">exception; it cannot silently reopen spending.</text></g><!--link *start* to PENDING_ACTIVATION--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-source-line="4" data-link-type="dependency"><path d="M157.98,94.158 C157.98,117.308 157.98,172.448 157.98,203.618" style="stroke:#385A75;stroke-width:1;" fill="none" id="*start*-to-PENDING_ACTIVATION"/><polygon points="157.98,208.618,161.98,199.618,157.98,203.618,153.98,199.618,157.98,208.618" fill="#385A75" style="stroke:#385A75;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="158.98" y="165.276" fill="#000" font-size="12" textLength="144.229">Idempotent core creation</text></g><!--link PENDING_ACTIVATION to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="5" data-link-type="dependency"><path d="M217.49,249.418 C248.65,260.088 287.25,274.058 320.98,288.478 C337.43,295.518 339.76,301.628 356.98,306.478 C461.23,335.888 797.804,350.676 893.734,354.366" style="stroke:#385A75;stroke-width:1;" fill="none" id="PENDING_ACTIVATION-to-ACTIVE"/><polygon points="898.73,354.558,889.89,350.215,893.734,354.366,889.583,358.209,898.73,354.558" fill="#385A75" style="stroke:#385A75;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="357.98" y="302.306" fill="#000" font-size="12" textLength="254.246">Eligibility + controls + accepted terms current</text></g><!--link PENDING_ACTIVATION to OPENING_FAILED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="6" data-link-type="dependency"><path d="M88.18,246.118 C46.53,258.968 6,279.308 29.98,306.478 C51.85,331.268 258.519,346.255 360.969,352.265" style="stroke:#385A75;stroke-width:1;" fill="none" id="PENDING_ACTIVATION-to-OPENING_FAILED"/><polygon points="365.96,352.558,357.21,348.038,360.969,352.265,356.741,356.024,365.96,352.558" fill="#385A75" style="stroke:#385A75;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="30.98" y="302.306" fill="#000" font-size="12" textLength="285.746">Definitive activation failure / no funded obligations</text></g><!--link PENDING_ACTIVATION to PENDING_ACTIVATION--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk8" data-source-line="7" data-link-type="dependency"><path d="M227.87,216.178 C247.49,216.738 262.56,221.008 262.56,228.968 C262.56,236.928 252.488,241.045 232.868,241.605" style="stroke:#385A75;stroke-width:1;" fill="none" id="PENDING_ACTIVATION-to-PENDING_ACTIVATION"/><polygon points="227.87,241.748,236.98,245.49,232.868,241.605,236.752,237.493,227.87,241.748