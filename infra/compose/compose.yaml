name: piggybank
services:
  postgres:
    image: docker.io/library/postgres:18.4-bookworm@sha256:c7d36c2369348f77fe9558f1970f7a0ea80ed55dfdf9500eb734159bd4df684d
    environment:
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD: synthetic-admin-only
      POSTGRES_DB: piggybank
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_admin -d piggybank"]
      interval: 3s
      timeout: 2s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0@sha256:24896bcb632fa37445c8ca979886f5b2370651335b92ed72724369f8e5f56b4f
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: synthetic-keycloak-only
      KC_HOSTNAME: http://127.0.0.1:18280
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: synthetic-keycloak-admin-only
    ports: ["127.0.0.1:18280:8080"]
    volumes:
      - ../identity:/opt/keycloak/data/import:ro,Z
      - ../identity/themes/piggybank:/opt/keycloak/themes/piggybank:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
  nats:
    image: docker.io/library/nats:2.12.0-alpine@sha256:72100bb9c3af46712a7ef13ab91a2245898de9c9b3269c515331bf61fe0aa516
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:14222:4222", "127.0.0.1:18222:8222"]
    volumes: ["nats-data:/data"]
volumes:
  postgres-data:
  nats-data:
