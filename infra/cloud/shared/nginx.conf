worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_max_body_size 1m;
  proxy_connect_timeout 2s;
  proxy_read_timeout 15s;
  # Keep canonical API/auth paths, including traversal and escaped slash checks.
  map $request_uri $bad_channel_path {
    default 0;
    ~*^/(api|auth).*% 1;
    ~*^/(api|auth).*/\.\.?(?:/|\?|$) 1;
  }
  server {
    listen 127.0.0.1:4300;
    root /usr/share/nginx/customer;
    if ($bad_channel_path) { return 403; }
    location ~ ^/api/v1/(staff|providers)(/|$) { return 403; }
    location ~ ^/auth/(workforce|service)(/|$) { return 403; }
    location /api/ { proxy_pass http://127.0.0.1:4180; }
    location /auth/customer/ { proxy_pass http://127.0.0.1:4180; }
    location /auth/ { return 403; }
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 127.0.0.1:4301;
    root /usr/share/nginx/staff;
    if ($bad_channel_path) { return 403; }
    location /api/v1/staff/ { proxy_pass http://127.0.0.1:4180; }
    location /api/ { return 403; }
    location /auth/workforce/ { proxy_pass http://127.0.0.1:4180; }
    location /auth/ { return 403; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
