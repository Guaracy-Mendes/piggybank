[workspace]
members = ["crates/platform", "crates/identity", "crates/controls", "crates/adapters", "crates/core", "crates/documents", "crates/journeys", "crates/data", "crates/payments", "crates/rails", "crates/finance", "apps/bank-api", "apps/bank-worker", "apps/provider-simulator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.49"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
subtle = "2.6"
getrandom = "0.4"
ring = "0.17.14"
hmac = "0.12"
bank-identity = { path = "crates/identity" }
bank-controls = { path = "crates/controls" }
bank-core = { path = "crates/core" }
bank-documents = { path = "crates/documents" }
bank-journeys = { path = "crates/journeys" }
bank-data = { path = "crates/data" }
bank-payments = { path = "crates/payments" }
bank-rails = { path = "crates/rails" }
bank-finance = { path = "crates/finance" }
bank-adapters = { path = "crates/adapters" }
libc = "0.2"
bank-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
